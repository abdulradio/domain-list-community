name: Build geosite and srs files

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 2"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v3
        with:
          path: code

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version-file: code/go.mod

      - name: Set variables
        run: |
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M%S)" >> $GITHUB_ENV
          echo "RUADLIST_EASYLIST_REJECT_URL=https://easylist-downloads.adblockplus.org/ruadlist+easylist.txt" >> $GITHUB_ENV
          echo "PETERLOWE_REJECT_URL=https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext" >> $GITHUB_ENV
          echo "ADGUARD_DNS_REJECT_URL=https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" >> $GITHUB_ENV
          echo "DANPOLLOCK_REJECT_URL=https://someonewhocares.org/hosts/hosts" >> $GITHUB_ENV
          echo "WIN_SPY=https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt" >> $GITHUB_ENV
        shell: bash

      - name: Update lists
        run: |
          curl -sSL $RUADLIST_EASYLIST_REJECT_URL | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' > temp-reject.txt
          curl -sSL $ADGUARD_DNS_REJECT_URL | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' >> temp-reject.txt
          curl -sSL $PETERLOWE_REJECT_URL | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})$/ && print "$1\n"' >> temp-reject.txt
          curl -sSL $DANPOLLOCK_REJECT_URL | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})/ && print "$1\n"' | sed '1d' >> temp-reject.txt
          curl -sSL $WIN_SPY | grep "0.0.0.0" | awk '{print $2}' > ./code/data/win-spy

      - name: Sort and generate redundant lists
        run: |
          cat temp-reject.txt | sort --ignore-case -u > reject-list-with-redundant

      - name: Remove redundant domains
        run: |
          chmod +x ./code/findRedundantDomain.py
          ./code/findRedundantDomain.py ./reject-list-with-redundant ./reject-list-deleted-unsort
          [ ! -f "reject-list-deleted-unsort" ] && touch reject-list-deleted-unsort
          sort ./reject-list-deleted-unsort > ./reject-list-deleted-sort
          diff ./reject-list-deleted-sort ./reject-list-with-redundant | awk '/^>/{print $2}' > ./reject-list-without-redundant

      - name: Remove domains from "need-to-remove" lists
        run: |
          diff ./code/reject-need-to-remove.txt ./reject-list-without-redundant | awk '/^>/{print $2}' > temp-category-ads-all.txt    

      - name: Write lists to data directory
        run: |
          cat temp-category-ads-all.txt | sort --ignore-case -u | perl -ne '/^((?=^.{1,255})[a-zA-Z0-9][-_a-zA-Z0-9]{0,62}(\.[a-zA-Z0-9][-_a-zA-Z0-9]{0,62})*)/ && print "$1\n"' > ./code/data/category-ads-all

      - name: Build geosite.dat file
        run: |
          cd code || exit 1
          go run ./ --outputdir=../ --exportlists=tld-ru,tld-\!ru,geolocation-ru,google,category-ads-all,bittorrent,youtube,category-ru-news,win-spy

      - name: Install sing-box CLI
        run: |
          SING_BOX_VERSION=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name | sed 's/v//')
          curl -sSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" | tar -xz
          mv sing-box-*/sing-box /usr/local/bin/
          rm -rf sing-box-*

      # --- Компиляция доменных категорий в .srs ---
      - name: Compile geosite-*.srs for Sing-Box
        run: |
          mkdir -p ./tmp/json_rules ./publish

          for file in ./code/data/*; do
            if [ -f "$file" ]; then
              cat_name=$(basename "$file")
              echo "Processing domain category: ${cat_name} -> geosite-${cat_name}.srs"

              # Python-парсер синтаксиса geosite v2ray -> sing-box JSON Rule-Set
              python3 -c "
import json, sys, os

file_path = '$file'
data_dir = './code/data'

def parse_file(path):
    suffixes, fulls, keywords, regexes = [], [], [], []
    if not os.path.exists(path):
        return suffixes, fulls, keywords, regexes
        
    with open(path, 'r', encoding='utf-8', errors='ignore') as f:
        for line in f:
            line = line.strip()
            if not line or line.startswith('#'):
                continue
            # Игнорируем метаданные и атрибуты @
            line = line.split('@')[0].strip()
            
            if line.startswith('full:'):
                fulls.append(line[5:])
            elif line.startswith('keyword:'):
                keywords.append(line[8:])
            elif line.startswith('regexp:'):
                regexes.append(line[7:])
            elif line.startswith('include:'):
                inc_suffixes, inc_fulls, inc_keywords, inc_regexes = parse_file(os.path.join(data_dir, line[8:]))
                suffixes.extend(inc_suffixes)
                fulls.extend(inc_fulls)
                keywords.extend(inc_keywords)
                regexes.extend(inc_regexes)
            elif line.startswith('domain:'):
                suffixes.append(line[7:])
            else:
                suffixes.append(line)
    return list(set(suffixes)), list(set(fulls)), list(set(keywords)), list(set(regexes))

suffixes, fulls, keywords, regexes = parse_file(file_path)

rule = {}
if fulls: rule['domain'] = fulls
if suffixes: rule['domain_suffix'] = suffixes
if keywords: rule['domain_keyword'] = keywords
if regexes: rule['domain_regex'] = regexes

rule_set = {
    'version': 1,
    'rules': [rule] if rule else []
}

with open('./tmp/rule_${cat_name}.json', 'w') as out:
    json.dump(rule_set, out)
"

              # Компилируем только если есть сформированные правила
              sing-box rule-set compile ./tmp/rule_${cat_name}.json -o ./publish/geosite-${cat_name}.srs
            fi
          done

      - name: Clean up working directory before publication
        run: |
          rm -rf code

      - name: Generate geosite.dat sha256 hash
        run: |
          sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Generate Zip
        run: |
          zip -9 geosite.dat.zip geosite.dat
          sha256sum geosite.dat.zip > geosite.dat.zip.sha256sum

      - name: Generate XZ
        run: |
          xz -z -9 -k geosite.dat
          sha256sum geosite.dat.xz > geosite.dat.xz.sha256sum

      - name: Move all dat and hashes to publish
        run: |
          mv geosite.dat* *.txt ./publish/ 2>/dev/null || true

      - name: Git push assets to "release" branch
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Purge jsdelivr CDN
        run: |
          cd publish || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      # Удаляем архивы перед GitHub Release (в релизе будут только основные файлы и .srs)
      - name: Remove extra archives before Release upload
        run: rm -rf ./publish/*.zip* ./publish/*.xz*

      - name: Release and upload assets
        run: |
          gh release create ${{ env.TAG_NAME }} --generate-notes --latest --title ${{ env.RELEASE_NAME }} ./publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
